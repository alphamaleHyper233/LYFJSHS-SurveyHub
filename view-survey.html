<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Survey | SurveyHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script href="js/view.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/view.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="index.html">
        <i class="fa-solid fa-chart-pie me-2"></i>SurveyHub
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="settings.html">⚙ Settings</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Survey Display -->
  <div class="survey-container">
    <h1 id="surveyTitle"></h1>
    <p id="surveyDesc" class="text-muted"></p>
    <iframe id="surveyFrame" class="survey-frame" allowfullscreen></iframe>
    <a href="index.html" class="back-btn">Do you want to answer more?</a>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

</body>
</html>
